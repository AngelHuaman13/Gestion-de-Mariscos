name: accion_5_needs_cache

on:
  push:
    branches: [ feature/ashi, dev]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/gestionhotelesbackend
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache de dependencias Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('backend/gestionhotelesbackend/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Compilar
        run: mvn -B clean compile

  test:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/gestionhotelesbackend
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restaurar cache de Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('backend/gestionhotelesbackend/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Ejecutar tests y empaquetar
        run: mvn -B package