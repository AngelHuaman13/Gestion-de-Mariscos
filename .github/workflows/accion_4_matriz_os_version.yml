name: accion_4_matriz_os_version

on:
  push:
    branches: [feature/diego, dev]
  workflow_dispatch:

jobs:
  matriz:
    name: ${{ matrix.os }} - Java ${{ matrix.version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        version: ['21', '25']
    defaults:
      run:
        working-directory: backend/gestionhotelesbackend
        shell: bash
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v5

      - name: Configurar Java ${{ matrix.version }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.version }}
          cache: maven

      - name: Mostrar combinacion de la matriz
        run: |
          echo "Sistema operativo: ${{ matrix.os }} (${{ runner.os }})"
          echo "Version de Java: ${{ matrix.version }}"
          java -version

      # Si Maven Central falla al entregar una dependencia, se reintenta hasta
      # 3 veces. -U obliga a Maven a volver a buscar lo que no pudo descargar.
      - name: Compilar backend
        run: |
          for intento in 1 2 3; do
            mvn -B -ntp -U clean compile && exit 0
            if [ "$intento" -lt 3 ]; then
              echo "::warning::Intento $intento de 3 fallo; se reintenta en 20 s"
              sleep 20
            fi
          done
          echo "::error::El backend no compilo en 3 intentos"
          exit 1
