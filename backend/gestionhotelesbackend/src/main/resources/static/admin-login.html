<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso administrador | Rinconcito Marino</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <main class="container flex-grow-1 d-flex align-items-center justify-content-center py-5">
        <div class="row w-100 justify-content-center">
            <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">

                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-4 p-md-5">

                        <h3 class="text-center mb-4 fw-bold">Acceso administrador</h3>

                        <div id="loginError" class="alert alert-danger" hidden>
                            Usuario o contraseña incorrectos.
                        </div>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="usuario" class="form-label">Usuario</label>
                                <input type="text" id="usuario" name="usuario"
                                       class="form-control form-control-lg"
                                       placeholder="Ingrese su usuario" required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Contraseña</label>
                                <div class="position-relative">
                                    <input type="password" id="password" name="password"
                                           class="form-control form-control-lg pe-5"
                                           placeholder="Ingrese su contraseña" required>
                                    <button type="button" class="btn btn-link position-absolute top-50 end-0 translate-middle-y text-secondary"
                                            onclick="togglePass('password', this)" aria-label="Mostrar contraseña">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 btn-lg mt-2">Ingresar</button>
                            <p class="text-center mt-3 mb-0">
                                <a href="/index.html" class="text-decoration-none text-muted small">Volver a la tienda</a>
                            </p>
                        </form>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <script>
    function togglePass(id, btn) {
        var input = document.getElementById(id);
        var icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'bi bi-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'bi bi-eye';
        }
    }

    document.getElementById('loginForm').addEventListener('submit', async event => {
        event.preventDefault();
        const error = document.getElementById('loginError');
        error.hidden = true;

        const respuesta = await fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                usuario: document.getElementById('usuario').value.trim(),
                password: document.getElementById('password').value
            })
        });

        if (respuesta.ok) {
            location.href = '/index.html#adminSection';
        } else {
            error.hidden = false;
        }
    });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
