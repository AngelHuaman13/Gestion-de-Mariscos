# ---------- Service: MySQL (interno) ----------
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  type: ClusterIP
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306

---
# ---------- Service: Backend (interno) ----------
# Se llama "backend" porque asi lo busca el Nginx del frontend
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080

---
# ---------- Service: Frontend (expuesto) ----------
# Abrir en http://localhost:30080
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
